<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Tushar Thanvi, backend engineer and AI ML researcher">

  <!-- ============================================================
       Colours are chosen to sit legibly on both the light and dark
       GitHub themes. Background stays transparent on purpose.
         ink    #6e7781   name
         muted  #8c959f   subtitle and rule
         accent #5b7c99   ticks and cursor
       Every animation runs once and freezes. Nothing loops.
       ============================================================ -->

  <defs>
    <clipPath id="wipe">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width"
                 values="0;1000" dur="1.1s" begin="0.15s"
                 calcMode="spline" keyTimes="0;1" keySplines="0.16 0.84 0.24 1"
                 fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- name, revealed by a left to right wipe -->
  <g clip-path="url(#wipe)">
    <text x="40" y="96"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
          font-size="62" font-weight="700" letter-spacing="-1"
          fill="#6e7781">Tushar Thanvi</text>
  </g>

  <!-- the wipe edge, visible only while it travels -->
  <rect x="0" y="40" width="2" height="70" fill="#5b7c99" opacity="0">
    <animate attributeName="x" values="0;1000" dur="1.1s" begin="0.15s"
             calcMode="spline" keyTimes="0;1" keySplines="0.16 0.84 0.24 1"
             fill="freeze"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.25s" begin="0.15s"
             keyTimes="0;0.08;0.85;1" fill="freeze"/>
  </rect>

  <!-- terminal cursor, blinks three times then rests solid -->
  <rect x="536" y="52" width="24" height="50" fill="#5b7c99" opacity="0">
    <animate attributeName="opacity"
             values="0;0.75;0.75;0;0;0.75;0.75;0;0;0.75;0.75"
             dur="1.9s" begin="1.15s" repeatCount="1"
             keyTimes="0;0.02;0.14;0.16;0.3;0.32;0.44;0.46;0.6;0.62;1"
             fill="freeze"/>
  </rect>

  <!-- hairline rule, drawn outward from the left -->
  <line x1="40" y1="132" x2="40" y2="132" stroke="#8c959f" stroke-width="1">
    <animate attributeName="x2" values="40;960" dur="0.9s" begin="0.85s"
             calcMode="spline" keyTimes="0;1" keySplines="0.16 0.84 0.24 1"
             fill="freeze"/>
  </line>

  <!-- measure ticks, staggered along the rule -->
  <g stroke="#5b7c99" stroke-width="1">
    <line x1="40"  y1="132" x2="40"  y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.25s" fill="freeze"/></line>
    <line x1="155" y1="132" x2="155" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.33s" fill="freeze"/></line>
    <line x1="270" y1="132" x2="270" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.41s" fill="freeze"/></line>
    <line x1="385" y1="132" x2="385" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.49s" fill="freeze"/></line>
    <line x1="500" y1="132" x2="500" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.57s" fill="freeze"/></line>
    <line x1="615" y1="132" x2="615" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.65s" fill="freeze"/></line>
    <line x1="730" y1="132" x2="730" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.73s" fill="freeze"/></line>
    <line x1="845" y1="132" x2="845" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.81s" fill="freeze"/></line>
    <line x1="960" y1="132" x2="960" y2="140" opacity="0"><animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="1.89s" fill="freeze"/></line>
  </g>

  <!-- subtitle, fades and rises into place -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 10;0 0" dur="0.7s" begin="1.5s"
                      calcMode="spline" keyTimes="0;1" keySplines="0.16 0.84 0.24 1"
                      fill="freeze"/>
    <text x="42" y="168"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
          font-size="15" letter-spacing="5.5" fill="#8c959f">BACKEND ENGINEER / AI ML RESEARCHER</text>
  </g>

</svg>
